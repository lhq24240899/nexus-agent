# Nexus 工具注册表 —— 参考 providers.yaml 设计
- name: web_search
  label: 联网搜索
  description: 通过 DuckDuckGo 搜索互联网信息, 输入查询关键词返回搜索结果摘要
  category: search
- name: code_exec
  label: 代码执行
  description: 在本地执行 Python 代码, 返回标准输出和错误信息
  category: tool
- name: linux_terminal
  label: Linux终端
  description: 在嵌入的 Linux 系统中执行 shell 命令, 返回命令输出
  category: system
- name: current_time
  label: 当前时间
  description: 获取当前日期和时间
  category: tool
- name: file_read
  label: 读取文件
  description: 读取本地文本文件内容, 支持指定最大行数
  category: file
- name: file_write
  label: 写入文件
  description: 将内容写入本地文件, 文件存在则覆盖
  category: file
- name: file_list
  label: 列出目录
  description: 列出指定目录下的文件和子目录
  category: file
- name: code_search
  label: 代码搜索
  description: 在项目中搜索代码内容, 符号名走索引秒查, 文本走 grep, 支持正则/文件类型过滤
  category: file
- name: index_project
  label: 建立索引
  description: 扫描项目建立函数/类/变量符号索引, 大项目首次运行后 code_search 查符号名秒级返回
  category: file
- name: code_edit
  label: 精确编辑
  description: 精确编辑代码文件 (search/replace/insert/delete/append), 搜索文本必须唯一, 返回diff
  category: file
- name: project_analyze
  label: 项目分析
  description: 分析项目结构, 识别语言/框架/依赖/入口/测试框架, 改代码前必用
  category: file
- name: git
  label: Git查看
  description: 查看 Git 仓库状态/差异/提交记录/分支, 只读操作
  category: version_control
- name: http_request
  label: HTTP请求
  description: 发送 HTTP 请求获取网页内容或调用 API, 支持 GET/POST/PUT/DELETE, 可自动解析 HTML
  category: network
- name: news_search
  label: 新闻搜索
  description: 搜索最新热门新闻, 返回标题/摘要/来源/链接, 优先 Tavily 新闻 API, 回退 RSS 源
  category: news
- name: parallel_execute
  label: 并行执行
  description: 并行执行多个独立子任务, 每个子任务由独立子代理处理, 适合可拆分的多任务场景
  category: agent
- name: use_skill
  label: 加载技能
  description: 加载已有的技能工作流获取执行步骤引导, 支持列出所有技能或加载特定技能
  category: agent
- name: cleanup_temp
  label: 清理临时文件
  description: 清理本次任务在 temp/ 临时工作目录中生成的测试验证文件, 验证完成后主动调用
  category: system

- name: code_find_def
  label: 符号定位
  description: 精确定位函数/类的定义位置(文件+行号+签名+docstring), 改代码前必用
  category: file
- name: code_find_refs
  label: 引用追踪
  description: 查找函数/类在项目中所有被调用的位置, 重构/改名/删除前评估影响范围
  category: file
- name: code_outline
  label: 文件大纲
  description: 列出Python文件的结构大纲(所有类/函数名+行号+签名), 快速了解文件结构
  category: file

- name: code_edit_symbol

- name: code_lint
  description: 代码lint检查和自动格式化(Python ruff/JS prettier/Go gofmt)
  category: code
  enabled: true

- name: open_app
  label: 打开应用
  description: 打开Windows本地应用程序, 支持 chrome/edge/notepad/vscode/wechat/word/excel 等常见应用, 也支持完整路径
  category: system
- name: volume_control
  label: 音量控制
  description: 控制系统音量, 支持设置音量百分比、静音/取消静音、获取当前音量
  category: system
- name: lock_screen
  label: 锁屏
  description: 锁定Windows屏幕, 用户需重新登录
  category: system
- name: screenshot
  label: 截图
  description: 截取当前屏幕并保存到 temp/ 目录, 返回文件路径
  category: system
- name: system_info
  label: 系统信息
  description: "获取系统信息: 操作系统/CPU/内存/磁盘/CPU使用率"
  category: system
- name: run_command
  label: 系统命令
  description: 执行Windows系统命令(cmd/powershell), 用于系统管理, 危险操作(删除/关机/注册表)会被拦截
  category: system

- name: browser_open
  label: 打开网页
  description: 在Chrome浏览器中打开指定网址, 浏览器窗口保持打开供后续操作
  category: browser
- name: browser_click
  label: 点击元素
  description: 点击网页中的按钮/链接/元素, 支持CSS选择器、text=文本、role=类型
  category: browser
- name: browser_type
  label: 输入文本
  description: 在网页输入框中输入文本, 支持自动回车提交
  category: browser
- name: browser_get_text
  label: 抓取文本
  description: 获取网页内容, 不传选择器返回整页文本, 传选择器返回匹配元素文本, 用于抓数据
  category: browser
- name: browser_screenshot
  label: 浏览器截图
  description: 对当前浏览器页面截图保存到temp/目录
  category: browser
- name: browser_close
  label: 关闭浏览器
  description: 关闭浏览器窗口释放资源, 任务完成后调用
  category: browser
