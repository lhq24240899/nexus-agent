<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Agent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f7f8fa; color: #1f2328; height: 100vh;
    display: flex; flex-direction: column;
  }
  .header {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; padding: 10px 14px; font-size: 14px; font-weight: 600;
  }
  .messages {
    flex: 1; overflow-y: auto; padding: 12px;
  }
  .msg { margin-bottom: 10px; max-width: 90%; }
  .msg.user { margin-left: auto; }
  .msg .bubble {
    padding: 8px 12px; border-radius: 12px; font-size: 13px;
    line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: #667eea; color: #fff; }
  .msg.nexus .bubble { background: #fff; border: 1px solid #e1e4e8; }
  .input-bar {
    padding: 10px; border-top: 1px solid #e1e4e8; background: #fff;
    display: flex; gap: 8px;
  }
  .input-bar input {
    flex: 1; padding: 8px 12px; border: 1px solid #d0d7de;
    border-radius: 8px; font-size: 13px; outline: none;
  }
  .input-bar input:focus { border-color: #667eea; }
  .input-bar button {
    background: #667eea; color: #fff; border: none; padding: 0 16px;
    border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .input-bar button:disabled { background: #ccc; cursor: not-allowed; }
  .typing { color: #8b949e; font-style: italic; font-size: 12px; padding: 4px; }
</style>
</head>
<body>
<div class="header">Nexus 双核 Agent</div>
<div class="messages" id="messages">
  <div class="msg nexus"><div class="bubble">你好, 有什么可以帮你的?</div></div>
</div>
<div class="input-bar">
  <input id="input" placeholder="输入消息..." onkeydown="if(event.key==='Enter')send()">
  <button id="btn" onclick="send()">发送</button>
</div>
<script>
function addMsg(role, text) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<div class="bubble">' + escapeHtml(text) + '</div>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
async function send() {
  const input = document.getElementById('input');
  const btn = document.getElementById('btn');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  btn.disabled = true;
  addMsg('user', msg);
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.textContent = 'Nexus 思考中...';
  document.getElementById('messages').appendChild(typing);
  try {
    const resp = await fetch('/api/v1/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: msg}),
    });
    const data = await resp.json();
    typing.remove();
    if (data.answer) addMsg('nexus', data.answer);
    else addMsg('nexus', '错误: ' + (data.error || '未知错误'));
  } catch (e) {
    typing.remove();
    addMsg('nexus', '请求失败: ' + e.message);
  }
  btn.disabled = false;
  input.focus();
}
</script>
</body>
</html>
