steps:
- description: 获取项目整体概览，了解技术栈、模块划分与架构结构，确定审查重点方向。
  tool: project_analyze
- description: 枚举项目文件清单，识别入口文件、核心模块、配置、测试及文档等关键文件。
  tool: file_list
- description: 逐一读取关键源码与配置文件，理解核心逻辑、模块职责和潜在问题点。
  tool: mcp_project_filesystem_read_text_file
- description: 运行脚本进行静态分析，统计代码规模、复杂度、重复度、依赖关系等指标。
  tool: code_exec
- description: 针对分析过程中发现的疑点，读取对应源码或配置进一步验证问题根因。
  tool: mcp_project_filesystem_read_text_file
- description: 执行验证性代码或实验，确认性能瓶颈、逻辑缺陷及优化优先级。
  tool: code_exec
- description: 阅读项目文档、注释、测试及相关配置，补充上下文信息并形成优化建议论据。
  tool: mcp_project_filesystem_read_text_file
