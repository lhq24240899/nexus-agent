description: 在指定目录创建并验证一个简单的纯Python打印hello的脚本
name: create_python_hello_demo
required_tools:
- current_time
- linux_terminal
- linux_terminal
- linux_terminal
- code_exec
- file_write
- code_exec
steps:
- description: 获取当前时间，用于记录任务开始时间
  tool: current_time
- description: 检查目标目录是否存在，若不存在则创建（如D:\nexus_agent）
  tool: linux_terminal
- description: 确认当前路径及Python环境可用性
  tool: linux_terminal
- description: 在目标路径写入纯Python的hello.py脚本，包含main函数并打印hello
  tool: file_write
- description: 运行python hello.py，验证输出hello且退出码为0
  tool: code_exec
tags:
- python
- demo
- 脚本
- 文件写入
- 验证
trigger:
  keywords:
  - python
  - hello
  - demo
  - 写入文件
  - 脚本生成
  - 验证运行
  patterns: []
